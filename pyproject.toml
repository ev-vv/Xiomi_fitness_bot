[project]
name = "mifitness-extractor"
version = "0.1.0"
description = "Mi Fitness (Xiaomi Health cloud) extractor, analytics and Telegram bot"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "httpx>=0.27",
    "pycryptodome>=3.20",
    "polars>=1.0",
    "pyarrow>=15",
    "qrcode>=7.4",
    "duckdb>=1.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "anthropic>=2.1",
    "aiogram>=3.31",
    "celery[redis]>=5.4",
    "redis>=5",
    "matplotlib>=3.9",
    "sqlalchemy>=2",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2"]

[project.scripts]
mifit-extract = "extractor.cli:main"
mifit-analytics = "analytics.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["extractor", "analytics", "ai", "bot", "bot.handlers", "charts", "core", "storage", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
